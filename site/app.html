<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autograna</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // App instalado no iPhone: no modo claro, barra de status normal (texto escuro);
  // no escuro, a barra fica por cima do topo do app (texto claro).
  try { document.write('<meta name="apple-mobile-web-app-status-bar-style" content="' + (matchMedia('(prefers-color-scheme: dark)').matches ? 'black-translucent' : 'default') + '">'); } catch (e) {}
  // Endereço sem ".html" na barra (ex.: /app.html vira /app).
  try { var p = location.pathname; if (/\.html$/.test(p)) history.replaceState(null, '', (p === '/index.html' ? '/' : p.replace(/\.html$/, '')) + location.search + location.hash); } catch (e) {}
</script>
<meta name="apple-mobile-web-app-title" content="Autograna">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --side:#F6F7F8; --ink:#15181C; --muted:#69707A; --faint:#9AA1AA; --line:#E7E9EC; --hover:#F3F4F6; --track:#ECEEF0;
  --in:#1B8A5A; --out:#C4402F; --warn:#A8620A; --brand2:#0E9F6E;
  --accent:var(--ink); --accent-ink:var(--bg);
  --navbg:rgba(255,255,255,.93); --navline:rgba(0,0,0,.07); --navon:rgba(21,24,28,.08); --navsh:0 10px 30px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.06);
  --overlay:rgba(12,14,17,.45);
  --rp:13px;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --navbg:rgba(28,31,35,.93); --navline:rgba(255,255,255,.09); --navon:rgba(255,255,255,.12); --navsh:0 10px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
    --bg:#0F1113; --side:#15181B; --ink:#EDEFF1; --muted:#98A0A9; --faint:#6D747D; --line:#262A2F; --hover:#1B1F23; --track:#252A2F;
    --in:#4CC58F; --out:#F08574; --warn:#E3AE4D; --overlay:rgba(0,0,0,.6); --brand2:#34D399;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --navbg:rgba(28,31,35,.93); --navline:rgba(255,255,255,.09); --navon:rgba(255,255,255,.12); --navsh:0 10px 34px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  --bg:#0F1113; --side:#15181B; --ink:#EDEFF1; --muted:#98A0A9; --faint:#6D747D; --line:#262A2F; --hover:#1B1F23; --track:#252A2F;
  --in:#4CC58F; --out:#F08574; --warn:#E3AE4D; --overlay:rgba(0,0,0,.6); --brand2:#34D399;
}
:root[data-density="compact"]{--rp:7px}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
html{-webkit-tap-highlight-color:transparent}
/* iPhone com iOS 26, app instalado (barra de status translúcida): enquanto a página é mais curta que a tela, o iOS
   calcula a tela mais baixa e a barra de baixo "sobe" nas abas com pouco conteúdo (bug WebKit 301108). Com a página
   sempre da altura da tela, a barra fica no mesmo lugar em todas as abas. */
@media (display-mode:standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}}
button,a,.pick span{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .pos{color:var(--in)} .neg{color:var(--out)}
small{font-size:12.5px;color:var(--muted)}

/* estrutura */
.app{display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{position:sticky;top:0;height:100dvh;align-self:start;background:var(--side);border-right:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brandname{font-size:18px;font-weight:700;letter-spacing:-.025em;padding:0 10px;display:flex;align-items:center;gap:9px;min-width:0;color:var(--ink)}
.brandname .logo{width:28px;height:28px;flex:none;border-radius:8px}
.brandname .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandname .bn b{font-weight:700;color:var(--brand2)}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;border-radius:8px;padding:9px 10px;color:var(--muted);font-weight:500;text-align:left}
@media (hover:hover) and (pointer:fine){.ni:hover{background:var(--hover);color:var(--ink)}}
.ni[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--hover));color:var(--accent)}
.ni svg,.bi svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cnt{margin-left:auto;font-size:12px;color:var(--out);font-weight:600}
.side .grow{flex:1}
.savest{font-size:12px;color:var(--faint);padding:0 10px}
.nib{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500}
.savest.err{color:var(--out)}
.mainc{min-width:0}
#view{max-width:1000px;padding:30px 44px 120px}
.mtop{display:none;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));align-items:center;justify-content:space-between;gap:12px}
.mtop .brandname{cursor:pointer}
.bnav{display:none;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:520px;margin:0 auto;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:5px;border-radius:32px;
  background:var(--navbg);border:1px solid var(--navline);box-shadow:var(--navsh);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bnav{background:var(--bg)}}
.bi{position:relative;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;padding:5px 2px;min-height:52px;border-radius:26px}
.bi svg{width:22px;height:22px}
.bi[aria-current="page"]{color:var(--ink);background:var(--navon);font-weight:600}
.bi[aria-current="page"] svg{stroke-width:2}
.bi:active{transform:scale(.94)}
.bi .cnt{position:absolute;top:3px;left:calc(50% + 7px);margin:0;background:var(--out);color:#fff;border-radius:99px;padding:0 5px;font-size:10px;line-height:15px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)} .side{display:none} .mtop{display:flex} .bnav{display:grid}
  #view{padding:18px 16px calc(108px + env(safe-area-inset-bottom,0px))}
}

/* cabeçalho de página */
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:26px}
.ph h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.msw{display:flex;align-items:center;gap:2px}
.msw .lb{min-width:148px;text-align:center;font-weight:500}
.chev{width:32px;height:32px;border:0;background:none;border-radius:8px;font-size:20px;line-height:1;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.chev:hover{background:var(--hover);color:var(--ink)}}
.tbtn{background:none;border:0;padding:4px 6px;border-radius:6px;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
@media (hover:hover) and (pointer:fine){.tbtn:hover{text-decoration-color:var(--ink)}}
.tbtn.danger{color:var(--out);text-decoration-color:color-mix(in srgb,var(--out) 45%,transparent)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;font-weight:500}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--faint)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (hover:hover) and (pointer:fine){.btn.primary:hover{opacity:.9}}
.btn.danger{color:var(--out)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.block{width:100%}

.note{margin:0 0 22px;color:var(--muted);font-size:14px}
.note.warn{color:var(--warn)}
.ph h1.greet-h1{font-size:33px}
@media (max-width:520px){.ph h1.greet-h1{font-size:26px}}
.greet-ph .psub{font-size:15px}

/* resumo */
.bignum{font-size:46px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:4px 0 22px;overflow-wrap:anywhere}
@media (max-width:520px){.bignum{font-size:36px}}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 28px}
.figs span{display:block;font-size:13px;color:var(--muted)}
.figs b{display:block;font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:2px;overflow-wrap:anywhere}
.figs small{display:block;margin-top:1px}
@media (max-width:520px){.figs{gap:10px}.figs b{font-size:14px}}
.up-good{color:var(--in)} .up-bad{color:var(--out)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 60px;margin-top:38px;padding-top:34px;border-top:1px solid var(--line)}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr);gap:38px}}
.sec{min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sh h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.sh+.sub{margin:-8px 0 12px;color:var(--muted);font-size:13.5px}

/* gráficos */
.chart{width:100%;min-height:190px}
.chart svg{display:block;overflow:visible}
.ax{fill:var(--muted);font:11px var(--sans);font-variant-numeric:tabular-nums}
.axb{fill:var(--ink);font:600 11.5px var(--sans);font-variant-numeric:tabular-nums}
.gl{stroke:var(--line);stroke-width:1}
.zl{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.empty{color:var(--muted);padding:18px 0;font-size:14px}

/* listas */
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:9px 0}
.cn{display:flex;align-items:center;gap:9px;min-width:0}
.cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{font-weight:500;white-space:nowrap}
.cv small{font-weight:400}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ink);opacity:.78}
.bar i.over{background:var(--out);opacity:1}
.bar i.good{background:var(--in);opacity:1}
.bar i.warnc{background:var(--warn);opacity:1}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.lrow:first-of-type{border-top:0}
.lrow .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .t2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.lrow .r{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.lrow .amt{font-weight:500;white-space:nowrap}
.st.bad{color:var(--out)} .st.warn{color:var(--warn)} .st.ok{color:var(--in)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:var(--rp) 6px;margin:0 -6px;border-radius:0;width:calc(100% + 12px)}
@media (hover:hover) and (pointer:fine){.tr:hover{background:var(--hover)}}
.dayh+.tr{border-top:0}
.tr .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tr .t2{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tr .amt{font-weight:500;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:22px 0 6px}
.dayh:first-child{padding-top:4px}
.dl{margin:0}
.dl>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.dl>div:first-child{border-top:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:500;text-align:right} .dl dd small{display:block;font-weight:400}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;margin-bottom:8px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{flex:0 1 210px;min-width:0}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--hover);color:var(--ink)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);margin:0}
.chk input{width:auto;min-height:0}

/* formulários */
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-height:40px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=color]{width:28px;height:28px;min-height:0;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
label>input,label>select{margin-top:5px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--out);font-size:13px;min-height:18px;margin:0 0 6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;align-items:center}
.actions .spacer{margin-right:auto}
.typesw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--hover);padding:4px;border-radius:10px;margin-bottom:16px}
.typesw button{border:0;background:none;padding:8px;border-radius:7px;font-weight:500;color:var(--muted)}
.typesw button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* planejar */
.brow{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:6px 16px;align-items:center;padding:10px 0}
.brow .bin{position:relative}
.brow .bin input{padding:6px 10px 6px 30px;min-height:34px;text-align:right}
.brow .bin span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
.brow .cmeta{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px 16px;align-items:center;padding:10px 0}
.rrow .rin{display:flex;align-items:center;gap:6px;color:var(--muted)}
.rrow .rin input{padding:6px 8px;min-height:34px;text-align:right}
.rrow .cmeta{grid-column:1/-1;font-size:13px;color:var(--muted)}
.goalrow{padding:14px 0;border-top:1px solid var(--line)}
.goalrow:first-of-type{border-top:0}
.goalrow .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.goalrow .top b{font-weight:600}
.goalrow .bar{margin:9px 0 7px;height:6px}
.goalrow .bar i{background:var(--accent);opacity:1}
.goalrow .foot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

/* ajustes */
.set{padding:28px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0;padding-top:0}
.set h2{margin:0 0 4px;font-size:17px;font-weight:600}
.set>p{margin:0 0 14px;color:var(--muted);font-size:14px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;flex-wrap:wrap}
.frow>span{color:var(--ink)}
.frow input[type=text],.frow input[type=number],.frow select{width:220px;max-width:100%}
.frow input[type=number]{width:90px}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{outline:2px solid var(--ink);outline-offset:3px}
.sw.auto{background:conic-gradient(var(--ink) 0 50%,var(--bg) 0 100%)}
.cedit{display:flex;align-items:center;gap:8px;padding:5px 0}
.cedit input[type=text]{flex:1 1 120px;min-width:0;padding:6px 10px;min-height:36px}
.cedit select{flex:0 0 132px;padding:6px 8px;min-height:36px}
.ib{width:30px;height:30px;border:0;background:none;border-radius:6px;color:var(--muted);font-size:15px;line-height:1;flex:none}
@media (hover:hover) and (pointer:fine){.ib:hover{background:var(--hover);color:var(--ink)}}
.ib:disabled{opacity:.3;cursor:default}
.wrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.wrow label{margin:0;flex:1;display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.wrow input[type=checkbox]{width:auto;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;font-size:14px}
.chip button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
@media (hover:hover) and (pointer:fine){.chip button:hover{color:var(--out)}}
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:12px 0 18px}
.walletcard{position:relative;border-radius:14px;padding:14px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.walletcard .wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:600;font-size:13.5px;line-height:1.25}
.walletcard .wchip{width:24px;height:17px;border-radius:4px;flex:none}
.walletcard .wbal{font-size:19px;font-weight:700;letter-spacing:-.02em}
.walletcard .wactions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.walletcard .wbtn{border:0;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:600;cursor:pointer}
.walletcard .wdel{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer}
.inl{display:flex;gap:8px}
.inl input{flex:1}

/* economia */
.sec.wide{grid-column:1/-1}
.econ{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px 52px;margin-top:22px;align-items:start}
@media (max-width:900px){.econ{grid-template-columns:minmax(0,1fr)}}
.h3{font-size:15px;font-weight:600;margin:0 0 6px}
.ins{padding:13px 0;border-top:1px solid var(--line)}
h3+.ins{border-top:0}
.ins .t1{font-weight:500}
.ins .t2{font-size:13px;color:var(--muted);margin-top:1px}

function mkDocRef(path){
  return {
    collection: name => mkColRef(path+'/'+name),
    get: async () => { const snap = await getDoc(doc(fsDb, path)); return { exists: snap.exists(), data: () => snap.data() }; },
    set: data => setDoc(doc(fsDb, path), data)
  };
}
function mkColRef(path){
  return {
    doc: id => mkDocRef(path+'/'+id),
    get: async () => { const snap = await getDocs(collection(fsDb, path)); return { docs: snap.docs.map(d=>({ id:d.id, data:()=>d.data() })), size: snap.size }; }
  };
}

const txs = key => (S.months[key] && S.months[key].tx) || [];
function findTx(id){ for(const k in S.months){ const t = S.months[k].tx.find(x=>x.id===id); if(t) return t; } return null; }
// Gastos/entradas de carteiras "linkadas" (unificadas ao saldo principal), como se fossem
// lançamentos do mês — lidos direto do histórico da carteira, nunca duplicados como tx.
function walletsTxFor(key){
  const out=[];
  (S.main.wallets||[]).forEach(w=>{
    if(!w.linked) return;
    (w.log||[]).forEach(l=>{ if(l.txId || mk(l.date)!==key) return;
      out.push({id:'w-'+l.id, t:l.amt>=0?'in':'out', amt:Math.abs(l.amt), desc:(l.desc||(l.amt>=0?'Saldo adicionado':'Uso registrado'))+' · '+(w.name||brandOf(w.brand)[1]), date:l.date, cat:null, wallet:true, walletId:w.id}); });
  });
  return out;
}
function sumMonth(key){
  let inn=0,out=0,biggest=null; const byCat={}, days=new Set(), list=txs(key).filter(t=>!t.adj).concat(walletsTxFor(key));
  for(const t of list){
    if(t.t==='in') inn+=t.amt;
    else { out+=t.amt; if(t.cat) byCat[t.cat]=(byCat[t.cat]||0)+t.amt; days.add(t.date); if(!biggest||t.amt>biggest.amt) biggest=t; }
  }
  return {inn:inn,out:out,net:inn-out,byCat:byCat,biggest:biggest,count:list.length,spendDays:days.size};
}
function totalNet(){ let n=0; for(const k in S.months) for(const t of S.months[k].tx) n += t.t==='in'?t.amt:-t.amt; return n; }
// Saldo contínuo: tudo que entrou − tudo que saiu até a data, sem zerar na virada do mês.
// withWallets=true soma também o que foi movimentado direto nos cartões "unificados".
const isLinkedW = id => { const w=(S.main.wallets||[]).find(x=>x.id===id); return !!(w&&w.linked); };
// Um lançamento pago com cartão/VR só mexe no saldo principal se aquele cartão estiver unificado.
const hitsCash = (t,withWallets) => !t.walletId || (withWallets && isLinkedW(t.walletId));
function balanceUntil(day,withWallets){
  let n=0;
  for(const k in S.months) for(const t of S.months[k].tx){ if(t.date<=day && hitsCash(t,withWallets)) n += t.t==='in'?t.amt:-t.amt; }
  if(withWallets) (S.main.wallets||[]).forEach(w=>{ if(!w.linked) return; (w.log||[]).forEach(l=>{ if(!l.txId && l.date<=day) n+=l.amt; }); });
  return n;
}
const walletsTotal = () => (S.main.wallets||[]).reduce((a,w)=>a+w.balance,0);
function walletMonthSpent(w,key){ key=key||mk(TODAY); return (w.log||[]).filter(l=>l.amt<0 && mk(l.date)===key).reduce((a,l)=>a+Math.abs(l.amt),0); }
function creditCtx(){
  const cards = (S.main.wallets||[]).filter(w=>w.limit>0).map(w=>{
    const spent=walletMonthSpent(w); return {w:w,label:w.name||brandOf(w.brand)[1],limit:w.limit,spent:spent,avail:w.limit-spent};
  });
  const totalLimit=cards.reduce((a,c)=>a+c.limit,0), totalSpent=cards.reduce((a,c)=>a+c.spent,0);
  return {cards:cards, totalLimit:totalLimit, totalSpent:totalSpent, totalAvail:totalLimit-totalSpent};
}
const investTotal = () => (S.main.investments||[]).reduce((a,i)=>a+i.amount,0);
const goalsTotal = () => (S.main.goals||[]).filter(g=>g.type!=='debt').reduce((a,g)=>a+g.saved,0);
function patrimonioCtx(){
  const cash=balanceUntil(TODAY,false), wallets=walletsTotal(), invest=investTotal(), goals=goalsTotal();
  return {cash:cash, wallets:wallets, invest:invest, goals:goals, total:cash+wallets+invest+goals};
}

function billDue(b,key){
  if(b.rec){ if(key<b.from) return null; return key+'-'+pad(Math.min(b.day,dim(key))); }
  return mk(b.date)===key ? b.date : null;
}
function billsFor(key){
  return S.main.bills.map(b=>{ const due=billDue(b,key); return due ? {b:b,key:key,due:due,paid:(b.paid&&b.paid[key])||null} : null; })
    .filter(Boolean).sort((a,c)=>a.due.localeCompare(c.due));
}
const remindOf = b => b.remind==null ? ST().remind : b.remind;
function billStatus(i){
  if(i.paid) return {cls:'ok',label:'Paga'};
  const d = dayDiff(i.due,TODAY), r = remindOf(i.b);
  if(d<0) return {cls:'bad',label:'Atrasada há '+(-d)+(d===-1?' dia':' dias')};
  if(d===0) return {cls:'warn',label:'Vence hoje'};
  if(d<=r) return {cls:'warn',label:'Vence em '+d+(d===1?' dia':' dias')};
  return {cls:'',label:'Em '+d+' dias'};
}
function pendingBills(horizon){
  const cur = mk(TODAY), out=[];
  [addM(cur,-1),cur,addM(cur,1)].forEach(k=>billsFor(k).forEach(i=>{ if(!i.paid && dayDiff(i.due,TODAY)<=horizon(i)) out.push(i); }));
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
const attention = () => pendingBills(i=>remindOf(i.b));
const upcoming = () => pendingBills(()=>30);

let dirty = new Set(), timer = null, chain = Promise.resolve();
const refOf = k => k==='main' ? store.base.collection('state').doc('main') : store.base.collection('months').doc(k);
const saveText = () => ({saving:'Salvando…',saved:'Salvo na sua conta',local:'Salvo neste navegador',error:'Não foi possível salvar'}[S.save] || '');
function setSave(s){ S.save=s; document.querySelectorAll('.savest').forEach(el=>{ el.textContent=saveText(); el.classList.toggle('err',s==='error'); }); }
function touch(k){ dirty.add(k); setSave('saving'); clearTimeout(timer); timer=setTimeout(()=>{ chain=chain.then(flush); },450); }
async function flush(){
  const keys = Array.from(dirty); dirty.clear();
  if(!keys.length) return;
  try{
    if(store.db){
      for(const k of keys){
        const data = k==='main' ? clone(S.main) : {tx:clone(txs(k))};
        await refOf(k).set(data);
      }
      setSave('saved');
    } else {
      localStorage.setItem(LS, JSON.stringify({main:S.main,months:S.months}));
      setSave('local');
    }
  }catch(e){ keys.forEach(k=>dirty.add(k)); setSave('error'); if(e && e.code==='permission-denied' && window.__onDenied) window.__onDenied(); }
}
function touchAll(){ touch('main'); Object.keys(S.months).forEach(touch); }
async function loadAll(){
  if(store.db){
    const res = await Promise.all([refOf('main').get(), store.base.collection('months').get()]);
    if(res[0].exists) S.main = normalize(clone(res[0].data()));
    res[1].docs.forEach(d=>{ S.months[d.id] = {tx:clone(d.data().tx||[])}; });
    return res[0].exists || res[1].size>0;
  }
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const o=JSON.parse(raw); S.main=normalize(o.main); S.months=o.months||{}; return true; }
  }catch(e){}
  return false;
}

/* ---------- gráficos ---------- */
function niceScale(min,max,n){
  if(max<=min) max = min+100;
  const step0=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), norm=step0/mag;
  const step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo; v<=hi+step/2; v+=step) ticks.push(Math.round(v));
  return {lo:lo,hi:hi,ticks:ticks};
}
function drawFlow(el){
  const w = Math.max(240, el.clientWidth), h = 210, key = S.month, n = dim(key), cm = mk(TODAY);
  const last = key===cm ? dateOf(TODAY).getDate() : (key<cm ? n : 0), list = txs(key).filter(t=>!t.adj).concat(walletsTxFor(key));
  if(!list.length || !last){ el.innerHTML = '<div class="empty">Sem lançamentos neste mês.</div>'; return; }
  const net = new Array(n+1).fill(0);
  list.forEach(t=>{ net[dateOf(t.date).getDate()] += t.t==='in'?t.amt:-t.amt; });
  const cum = []; let run=0; for(let d=1; d<=last; d++){ run+=net[d]; cum.push(run); }
  const sc = niceScale(Math.min(0,Math.min.apply(null,cum)), Math.max(0,Math.max.apply(null,cum)), 4);
  const L=42,Rr=10,T=12,B=24, X=d=>L+(d-1)/(n-1)*(w-L-Rr), Y=v=>T+(sc.hi-v)/(sc.hi-sc.lo)*(h-T-B);
  let s = '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Saldo acumulado do mês">';
  sc.ticks.forEach(v=>{ s += '<line class="gl" x1="'+L+'" x2="'+(w-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+compact(v)+'</text>'; });
  if(sc.lo<0) s += '<line class="zl" x1="'+L+'" x2="'+(w-Rr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
  [1,5,10,15,20,25,n].filter((v,i,a)=>a.indexOf(v)===i && (v===n||n-v>=3||v===1)).forEach(d=>{ s += '<text class="ax" x="'+X(d)+'" y="'+(h-6)+'" text-anchor="'+(d===1?'start':d===n?'end':'middle')+'">'+d+'</text>'; });
  let line=''; cum.forEach((v,i)=>{ line += (i?'L':'M')+X(i+1).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  const area = line+'L'+X(last).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(1).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
  s += '<path d="'+area+'" fill="var(--accent)" fill-opacity=".07"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linejoin="round"/>';
  const ex=X(last), ey=Y(cum[last-1]), right = ex>w-96;
  s += '<circle cx="'+ex+'" cy="'+ey+'" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>';
  const below = ey < h-B-26;
  s += '<text class="axb halo" x="'+(right?ex-8:ex+8)+'" y="'+(below?ey+22:ey-12)+'" text-anchor="'+(right?'end':'start')+'">'+money(cum[last-1])+'</text></svg>';
  el.innerHTML = s;
}
function drawMonths(el){
  const w = Math.max(240, el.clientWidth), h = 210, keys=[]; for(let i=5;i>=0;i--) keys.push(addM(S.month,-i));
  const data = keys.map(k=>sumMonth(k)), mx = Math.max.apply(null,data.map(d=>Math.max(d.inn,d.out)));
  if(!mx){ el.innerHTML='<div class="empty">Sem lançamentos nos últimos 6 meses.</div>'; return; }
  const sc = niceScale(0,mx,4), L=42,Rr=6,T=12,B=24, gw=(w-L-Rr)/6, bw=Math.max(6,Math.min(22,gw*0.3));
  const Y=v=>T+(sc.hi-v)/(sc.hi-sc.lo)*(h-T-B);
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Entradas e saídas dos últimos 6 meses">';
  sc.ticks.forEach(v=>{ s+='<line class="gl" x1="'+L+'" x2="'+(w-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+compact(v)+'</text>'; });
  keys.forEach((k,i)=>{
    const cx=L+gw*i+gw/2, sel=k===S.month, op=sel?1:.38, d=data[i];

    s+='<text class="'+(sel?'axb':'ax')+'" x="'+cx+'" y="'+(h-6)+'" text-anchor="middle">'+monthShort(k)+'</text>';

  });
  el.innerHTML = s+'</svg>';
}

const fmtMonths = n => n<12 ? n+(n===1?' mês':' meses') : (Math.floor(n/12)+(Math.floor(n/12)===1?' ano':' anos')+(n%12?' e '+(n%12)+(n%12===1?' mês':' meses'):''));
const monthYear = key => monthShort(key)+'/'+key.slice(0,4);
function monthsToGoal(g,monthly){
  const rem=Math.max(0,g.target-g.saved); if(rem===0) return {months:0,interest:0};
  if(!(monthly>0)) return null;
  const r=g.type==='debt'?(g.rate||0)/100:0;
  if(r>0){ if(monthly<=rem*r) return {never:true}; const n=Math.ceil(-Math.log(1-rem*r/monthly)/Math.log(1+r)); return {months:n,interest:Math.max(0,Math.round(monthly*n-rem))}; }
  return {months:Math.ceil(rem/monthly),interest:0};
}
function neededMonthly(g,ml){
  const rem=Math.max(0,g.target-g.saved), r=g.type==='debt'?(g.rate||0)/100:0;
  const x = r>0 ? rem*r/(1-Math.pow(1+r,-ml)) : rem/ml;
  return Math.ceil(x/100)*100;
}
function goalInfo(g){
  const rem=Math.max(0,g.target-g.saved), debt=g.type==='debt';
  if(rem===0) return '<span class="pos">'+(debt?'Dívida quitada':'Meta atingida')+'</span>';
  const out=[];
  if(g.monthly){ const r=monthsToGoal(g,g.monthly); out.push(r&&r.never?'<span class="neg">A parcela não cobre os juros</span>':'Com '+money(g.monthly)+' por mês: '+fmtMonths(r.months)+' ('+monthYear(addM(mk(TODAY),r.months))+')'); }
  if(g.date){ const a=mk(g.date).split('-').map(Number), b=mk(TODAY).split('-').map(Number), ml=(a[0]-b[0])*12+(a[1]-b[1]);
    out.push(ml>0?(debt?'Pague ':'Guarde ')+money(neededMonthly(g,ml))+' por mês até '+monthYear(mk(g.date)):'<span class="neg">Prazo vencido</span>'); }
  if(!out.length) out.push((debt?'Falta pagar ':'Faltam ')+money(rem));
  return out.join(' · ');
}
function analysis(){
  const key=S.month, cm=mk(TODAY), cur=sumMonth(key);
  const elapsed = key===cm ? dateOf(TODAY).getDate() : (key<cm ? dim(key) : 0);
  const frac = key===cm && elapsed ? elapsed/dim(key) : 1;
  const prevKeys=[1,2,3].map(i=>addM(key,-i)).filter(k=>txs(k).length), prev=prevKeys.map(sumMonth), np=prev.length;
  const avgNet = np ? Math.round(prev.reduce((a,p)=>a+p.net,0)/np) : null;
  const avgCat = id => np ? Math.round(prev.reduce((a,p)=>a+(p.byCat[id]||0),0)/np) : 0;
  const avgCount = id => np ? prevKeys.reduce((a,k)=>a+txs(k).filter(t=>t.t==='out'&&t.cat===id).length,0)/np : 0;
  const found={}, add=(cat,item)=>{ if(!found[cat]||item.save>found[cat].save) found[cat]=item; };
  const cats=S.main.cats.out;
  cats.forEach(c=>{
    const spent=cur.byCat[c.id]||0, avg=avgCat(c.id), lim=S.main.budgets[c.id]||0;
    if(lim && spent>lim) add(c.id,{cat:c.id,title:c.name+' passou do limite',detail:money(spent)+' gastos, limite de '+money(lim),save:spent-lim,kind:'limit'});
    if(np && avg>0){
      let ex=0, why='';
      if(spent>=avg*1.10+3000){ ex=spent-avg; why='já são '+money(spent)+' neste mês, contra média de '+money(avg); }
      else if(key===cm && frac<1 && avgCount(c.id)>=3 && spent>=avg*.5){ const pace=Math.round(spent/frac); if(pace>=avg*1.2+3000){ ex=pace-avg; why='no ritmo de '+money(pace)+' no mês, contra média de '+money(avg); } }
      if(ex>0) add(c.id,{cat:c.id,title:c.name+' acima do seu normal',detail:cap(why),save:ex,kind:'trend',limit:Math.max(1000,Math.round(avg/1000)*1000)});
    }
  });
  const groups={};
  txs(key).forEach(t=>{ if(t.t!=='out'||t.bill) return; if(/assinatur/i.test(catById(t.cat).name)) return; const k=t.cat+'|'+t.desc.trim().toLowerCase(); const o=groups[k]=groups[k]||{cat:t.cat,desc:t.desc.trim(),n:0,total:0}; o.n++; o.total+=t.amt; });
  Object.keys(groups).map(k=>groups[k]).filter(g=>g.n>=4&&g.total>=10000).forEach(g=>add(g.cat,{cat:g.cat,title:g.desc+' se repete '+g.n+' vezes',detail:'Somam '+money(g.total)+' no mês. Cortar uma a cada quatro libera '+money(Math.round(g.total/4/100)*100)+'.',save:Math.round(g.total/4),kind:'repeat'}));
  cats.filter(c=>/assinatur/i.test(c.name)).forEach(c=>{ const tot=cur.byCat[c.id]||0; if(tot>=5000) add(c.id,{cat:c.id,title:c.name+' somam '+money(tot)+' por mês',detail:'São '+money(tot*12)+' por ano. Cancelar uma de cada cinco libera '+money(Math.round(tot/5/100)*100)+'.',save:Math.round(tot/5),kind:'subs'}); });
  const items=Object.keys(found).map(k=>found[k]).sort((a,b)=>b.save-a.save);
  const total=items.reduce((a,i)=>a+i.save,0);
  const avgDaily = elapsed ? Math.round(cur.out/elapsed) : 0, projOut = key===cm ? avgDaily*dim(key) : cur.out;
  const target=ST().rule.save, gap = cur.inn ? Math.max(0, Math.round(cur.inn*target/100)-Math.max(0,cur.net)) : 0;
  return {cur:cur,key:key,cm:cm,items:items,total:total,avgNet:avgNet,np:np,avgCat:avgCat,gap:gap,target:target,projNet:cur.inn-projOut};
}

function fluxoCtx(key){

  const list = txs(key).filter(t=>!t.adj).concat(walletsTxFor(key)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  let run=0, low={v:0,date:key+'-01'};

    if(run<low.v) low={v:run,date:t.date};
    return {date:t.date,desc:t.desc+(t.wallet?' (cartão vinculado)':''),amt:t.t==='in'?t.amt:-t.amt,real:true,bal:run};
  });
  let projRows=[], projLow={v:low.v,date:low.date}, willGoNeg=false, negDate=null;
  if(isCur){
    const pend = billsFor(key).filter(i=>!i.paid && i.due>=TODAY).sort((a,b)=>a.due.localeCompare(b.due));
    let prun=run;
    pend.forEach(i=>{
      prun -= i.b.amt;
      if(prun<0 && !willGoNeg){ willGoNeg=true; negDate=i.due; }
      if(prun<projLow.v) projLow={v:prun,date:i.due};
      projRows.push({date:i.due,desc:i.b.name,amt:-i.b.amt,real:false,bal:prun});
    });
  }
  return {key:key,isCur:isCur,rows:rows,projRows:projRows,run:run,low:low,projLow:projLow,willGoNeg:willGoNeg,negDate:negDate};
}
function fluxoTips(F){

// A "fatia" agora sai do mesmo saldo da Início: o que você tem hoje, menos as contas
// que ainda vão vencer até o próximo dinheiro entrar, dividido pelos dias que faltam.
function fatiaCtx(){
  const cfg = S.main.daily || {amount:0,cycleDay:1,cycle:''};
  const cycleDay = Math.min(28,Math.max(1,cfg.cycleDay||1));
  const range = cycleRange(cycleDay,TODAY);
  const daysTotal = dayDiff(range.end,range.start)+1, daysLeft = dayDiff(range.end,TODAY)+1;
  let all=[]; Array.from(new Set([mk(range.start),mk(TODAY),mk(range.end)])).forEach(k=>{ all=all.concat(txs(k).filter(t=>!t.adj && hitsCash(t,true))).concat(walletsTxFor(k)); });
  const inCycle = all.filter(t=>t.date>=range.start && t.date<=range.end);
  const monthOut = inCycle.filter(t=>t.t==='out' && t.date<=TODAY);
  const spentMonth = monthOut.reduce((a,t)=>a+t.amt,0);
  const spentToday = monthOut.filter(t=>t.date===TODAY).reduce((a,t)=>a+t.amt,0);
  const futOut = inCycle.filter(t=>t.t==='out' && t.date>TODAY).reduce((a,t)=>a+t.amt,0);
  const futIn = inCycle.filter(t=>t.t==='in' && t.date>TODAY).reduce((a,t)=>a+t.amt,0);
  // contas ainda não pagas que vencem até o fim do ciclo (inclui atrasadas de até 31 dias)
  const cm=mk(TODAY), seen={}; let bills=0; const billList=[];
  [addM(cm,-1),cm,addM(cm,1)].forEach(k=>billsFor(k).forEach(i=>{
    const key=i.b.id+'@'+i.key; if(seen[key]) return; seen[key]=1;
    if(!i.paid && i.due<=range.end && dayDiff(TODAY,i.due)<=31){ bills+=i.b.amt; billList.push(i); }
  }));
  const saldo = balanceUntil(TODAY,true);
  const base = saldo + spentToday;                    // saldo no começo do dia de hoje
  const committed = bills + futOut - futIn;           // o que já tem destino até o próximo dinheiro
  const remainingMonth = base - committed;            // livre para o resto do ciclo, contando hoje
  const dailyAllowance = remainingMonth>0 ? remainingMonth/daysLeft : 0;
  const todayLeft = dailyAllowance - spentToday;
  const daysLeftAfterToday = daysLeft-1;
  const tomorrowAllowance = daysLeftAfterToday>0 ? Math.max(0,remainingMonth-Math.max(spentToday,dailyAllowance))/daysLeftAfterToday : null;
  let status='ok'; if(remainingMonth-spentToday<0) status='bad'; else if(todayLeft<0) status='warn';
  return {cfg:cfg,cycleDay:cycleDay,cycleSet:!!cfg.cycle,range:range,active:true,daysTotal:daysTotal,daysLeft:daysLeft,monthOut:monthOut,spentMonth:spentMonth,
    saldo:saldo,base:base,bills:bills,billList:billList,futOut:futOut,futIn:futIn,committed:committed,remainingMonth:remainingMonth,
    dailyAllowance:dailyAllowance,spentToday:spentToday,todayLeft:todayLeft,tomorrowAllowance:tomorrowAllowance,status:status};
}

function wireCarousel(){
  const el=document.querySelector('[data-carousel]'); if(!el) return;
  const n=el.children.length; S.deck=Math.max(0,Math.min(S.deck||0,n-1));
  if(el.clientWidth) el.scrollLeft=S.deck*el.clientWidth;
  fitDeck(el,S.deck);
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitDeck(el,S.deck)); }catch(e){}
  let t=null;
  el.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(()=>{
    const i=Math.round(el.scrollLeft/Math.max(1,el.clientWidth)); S.deck=i;
    document.querySelectorAll('.dtab').forEach((b,j)=>{ b.classList.toggle('on',j===i); b.setAttribute('aria-selected',j===i); });
    fitDeck(el,i);
  },60); },{passive:true});
}

// S.bill vem do servidor (versão publicada). Sem servidor (prévia), o app funciona livre.
const fmtD = iso => iso ? shortDate(ymd(new Date(iso))) : '';
const billPrice = () => money(Math.round(((S.bill&&S.bill.price)||39.9)*100));
function daysLeft(iso){ return Math.max(0, Math.ceil((new Date(iso) - Date.now())/864e5)); }
const pixOn = b => !!(b && b.pixUntil && new Date(b.pixUntil) > Date.now());
// Botões de pagar: cartão primeiro (renova sozinho); quem já paga no Pix vê o Pix primeiro.
const payBtns = (primaryPix, again) => primaryPix
  ? '<button class="btn primary" data-act="payPix">'+(again?'Pagar mais 1 mês no Pix':'Pagar com Pix')+'</button><button class="btn" data-act="payCard">Assinar no cartão</button>'
  : '<button class="btn primary" data-act="payCard">Cadastrar cartão</button><button class="btn" data-act="payPix">Pagar com Pix</button>';
const BRAND = {visa:'Visa',master:'Mastercard',amex:'Amex',elo:'Elo',hipercard:'Hipercard',diners:'Diners',debvisa:'Visa',debmaster:'Mastercard',debelo:'Elo'};
const cardLabel = b => (BRAND[b&&b.cardBrand]||'cartão')+(b&&b.cardLast4?' •••• '+b.cardLast4:'');
function billBanner(){
  const b=S.bill; if(!b || b.isAdmin || !b.access) return '';
  const subscribed = b.mpStatus==='authorized';
  if(b.status==='trial' && subscribed){ if(daysLeft(b.trialEnd)>1) return '';   // só no último dia, pra não poluir
    return '<div class="billbar"><span>Seu teste acaba hoje · a 1ª cobrança de '+billPrice()+' vai para o '+esc(cardLabel(b))+'</span><button class="tbtn" data-act="cardSwap">Trocar cartão</button></div>'; }
  if(b.status==='trial' && pixOn(b)) return '<div class="billbar"><span>Teste grátis até '+fmtD(b.trialEnd)+' · seu mês no Pix já está pago, até '+fmtD(b.pixUntil)+'</span></div>';
  if(b.status==='trial'){
    const n=daysLeft(b.trialEnd);
    if(n>1 && b.mpStatus!=='pending') return '';   // no teste, o aviso de assinar só aparece no último dia
    return '<div class="billbar"><span>Teste grátis · '+(n<=1?'termina hoje':'faltam '+n+' dias')+'</span><button class="btn sm primary" data-act="subscribe">Continuar · '+billPrice()+'/mês</button>'+(b.mpStatus==='pending'?'<button class="tbtn" data-act="billSync">Já paguei</button>':'')+'</div>';
  }
  if(b.status==='active' && b.method==='pix'){
    const n=daysLeft(b.pixUntil); if(n>5) return '';
    return '<div class="billbar"><span>Seu mês no Pix termina '+(n<=1?'hoje':'em '+n+' dias')+' ('+fmtD(b.pixUntil)+')</span><button class="btn sm primary" data-act="payPix">Pagar mais 1 mês</button><button class="tbtn" data-act="payCard">Assinar no cartão</button></div>';
  }
  if(b.status==='awaiting') return '<div class="billbar"><span>Pagamento em processamento no Mercado Pago · o app fica liberado enquanto isso</span><button class="tbtn" data-act="billSync">Verificar</button></div>';
  if(b.status==='retrying') return '<div class="billbar st warn"><span>Não conseguimos cobrar seu cartão. O Mercado Pago tenta de novo nos próximos dias, ou você pode trocar o cartão.</span><button class="btn sm primary" data-act="cardSwap">Trocar cartão</button><button class="tbtn" data-act="billSync">Verificar</button></div>';
  if(b.status==='cancelled') return '<div class="billbar"><span>Assinatura cancelada · acesso até '+fmtD(b.accessUntil)+'</span><button class="btn sm" data-act="subscribe">Assinar de novo</button></div>';
  return '';
}

function billSection(){
  if(!window.__billing) return '<section class="set"><h2>Assinatura</h2><p>A assinatura funciona na versão publicada do app.</p></section>';
  const b=S.bill;
  if(!b) return '<section class="set"><h2>Assinatura</h2><p>Não consegui consultar sua assinatura agora.</p><div class="actions" style="justify-content:flex-start"><button class="btn" data-act="billSync">Tentar de novo</button></div></section>';

  let p='', btns='';

  else if(b.status==='active' && b.method==='pix'){ p='<b>Pago no Pix</b> até '+fmtD(b.pixUntil)+'. Não renova sozinho: perto do fim, o app lembra você de pagar o próximo mês.'; btns=payBtns(true,true); }
  else if(b.status==='active'){ const nx=b.nextPayment||b.paidUntil; p='<b>Ativa no '+esc(cardLabel(b))+'</b> · '+billPrice()+'/mês'+(nx?' · próxima cobrança em '+fmtD(nx):''); btns=swap+cancel; }
  else if(b.status==='trial' && subscribed){ p='<b>Cartão cadastrado</b> ('+esc(cardLabel(b))+'). A 1ª cobrança de '+billPrice()+' é em '+fmtD(b.trialEnd)+', quando o teste acabar. Cancele antes e nada é cobrado.'; btns=swap+cancel; }
  else if(b.status==='trial' && pixOn(b)){ p='<b>Teste grátis</b> até '+fmtD(b.trialEnd)+'. Seu mês no Pix já está pago e vai até '+fmtD(b.pixUntil)+'.'; btns=''; }
  else if(b.status==='trial'){ p='<b>Teste grátis</b> até '+fmtD(b.trialEnd)+'. Cadastre o cartão agora e só pague nesse dia, ou pague no Pix: '+billPrice()+'/mês.'; btns=payBtns(false)+(b.mpStatus==='pending'?'<button class="btn" data-act="billSync">Já paguei — verificar</button>':''); }
  else if(b.status==='awaiting'){ p='<b>Aguardando a 1ª cobrança</b> no '+esc(cardLabel(b))+'. Costuma levar até 1 hora.'; btns='<button class="btn" data-act="billSync">Verificar</button>'+swap+cancel; }
  else if(b.status==='retrying'){ p='<b>Cobrança não aprovada</b> no '+esc(cardLabel(b))+'. O Mercado Pago tenta de novo nos próximos dias, ou troque o cartão.'; btns='<button class="btn primary" data-act="cardSwap">Trocar cartão</button><button class="btn" data-act="billSync">Verificar</button>'+cancel; }
  else if(b.status==='cancelled'){ p='<b>Cancelada</b>'+(b.access?' · você usa até '+fmtD(b.accessUntil):'')+'.'; btns=payBtns(false); }
  else { p='Sem assinatura ativa.'; btns=payBtns(false); }
  return '<section class="set"><h2>Assinatura</h2><p>'+p+'</p>'+(btns?'<div class="actions" style="justify-content:flex-start">'+btns+'</div>':'')+'</section>';
}

let mpSdk=null, mpSdkKey='', mpLoading=null, cardF=null;

  if(window.MercadoPago) return Promise.resolve();

  mpLoading=new Promise((ok,fail)=>{

function drvCalc(d, c){
  c = c || DRV().cfg;
  const km = Math.max(0, (d.odoEnd||0) - (d.odoStart||0));
  const fuelEst = c.kml>0 ? Math.round(km / c.kml * c.fuel) : 0;
  const fuel = d.fuelReal>0 ? d.fuelReal : fuelEst;
  const wear = Math.round(km * c.costKm);
  const rent = c.rentWeek>0 ? Math.round(c.rentWeek / Math.max(1,c.workDays)) : 0;

  const t={days:days.length,gross:0,net:0,km:0,trips:0,hours:0,fuel:0,wear:0,rent:0,other:0};

// Meta do mês → quanto falta hoje, e quantas corridas/km/horas isso dá na sua média.
function drvGoal(){
  const D=DRV(), c=D.cfg, key=mk(TODAY);
  const month = D.days.filter(d=>mk(d.date)===key), m = drvSum(month);
  const todayDone = D.days.filter(d=>d.date===TODAY), td = drvSum(todayDone);
  const lastDay = dim(key), today = dateOf(TODAY).getDate();
  const calLeft = lastDay - today + 1;                         // dias de calendário que faltam, contando hoje
  const workLeft = Math.max(1, Math.round(calLeft * c.workDays / 7));
  const before = m.net - td.net;                                // lucro do mês até ontem
  const needMonth = Math.max(0, c.goalMonth - before);
  const perDay = c.goalMonth ? Math.ceil(needMonth / workLeft) : 0;
  const leftToday = Math.max(0, perDay - td.net);
  const from = addDays(TODAY,-30), recent = drvSum(D.days.filter(d=>d.date>=from));
  return { goal:c.goalMonth, month:m, today:td, todayDone:todayDone.length>0, perDay, leftToday, workLeft,
    pct: c.goalMonth ? Math.min(100, Math.max(0, m.net/c.goalMonth*100)) : 0,
    trips: recent.netPerTrip>0 ? Math.ceil(leftToday/recent.netPerTrip) : null,
    km: recent.netPerKm>0 ? Math.ceil(leftToday/recent.netPerKm) : null,
    hours: recent.perHour>0 ? Math.ceil(leftToday/recent.perHour*2)/2 : null, recent };
}

// Leva até uma seção (pelo título) e dá um brilho rápido nela — sem mexer no layout.
function copFlash(sel, text){
  setTimeout(()=>{
    let el=null;
    if(text){ el=[...document.querySelectorAll(sel)].find(x=>{ const h=x.querySelector('h2,h3'); return h && h.textContent.trim().indexOf(text)===0; }); }
    else el=document.querySelector(sel);
    if(!el) return;
    const y=el.getBoundingClientRect().top+window.scrollY-90;
    window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    el.classList.remove('copflash'); void el.offsetWidth; el.classList.add('copflash');
    setTimeout(()=>el.classList.remove('copflash'),2400);
  },60);
}

const copRaw = s => copNorm(s).split(/\s+/).filter(w=>w && !COP_STOP.has(w) && w.length>2).map(w=>w.length>5?w.slice(0,5):w.replace(/s$/,''));
const copNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ');
function copTok(s){
  const out=[];
  copNorm(s).split(/\s+/).forEach(w=>{
    if(!w || COP_STOP.has(w) || (w.length<2 && !/^\d+$/.test(w))) return;
    let t = w==='99' ? 'motorista' : w;
    const k6=t.slice(0,6), k5=t.slice(0,5), k4=t.slice(0,4);
    if(COP_SYN[t]) t=COP_SYN[t]; else if(t.length>=6 && COP_SYN[k6]) t=COP_SYN[k6]; else if(t.length>=5 && COP_SYN[k5]) t=COP_SYN[k5]; else if(COP_SYN[k4]) t=COP_SYN[k4];
    out.push(t.length>5 ? t.slice(0,5) : t.replace(/s$/,''));
  });
  return out;
}
let COP_IDX=null;
function copIndex(){
  if(COP_IDX) return COP_IDX;
  const df={};
  const docs=COP.map(x=>{ const kw=new Set(copTok(x.k+' '+x.q)), qt=new Set(copTok(x.q)), raw=new Set(copRaw(x.k+' '+x.q)); kw.forEach(t=>df[t]=(df[t]||0)+1); return {x,kw,qt,raw}; });
  COP_IDX={docs,df,n:COP.length}; return COP_IDX;
}
function copSearch(text){
  const I=copIndex(), qt=[...new Set(copTok(text))], qr=[...new Set(copRaw(text))];
  if(!qt.length) return [];
  return I.docs.filter(d=>copOk(d.x)).map(d=>{
    let s=0, hit=0;
    qt.forEach(t=>{ if(d.kw.has(t)){ s+=1+Math.log(I.n/(I.df[t]||1)); hit++; if(d.qt.has(t)) s+=0.6; } });
    if(hit){ s*= (0.6+0.4*hit/qt.length); qr.forEach(t=>{ if(d.raw.has(t)) s+=0.8; }); s+=d.x.pri||0; }   // cobre mais da pergunta + palavra exata + prioridade
    return {x:d.x,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
}

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const CAT_RULES_OUT = [[/mercad|feira|atacad|hortifruti|acougue|sacolao|supermerc/,/mercado/],[/uber|\b99\b|taxi|combust|gasolina|etanol|posto|estacion|pedagio|onibus|metro|bilhete/,/transporte/],[/ifood|restaurante|lanche|pizza|hamburg|cafe|padaria|almoco|jantar|sorvete|acai|churrasc|\bbar\b/,/restaurante/],[/farmacia|drogaria|consulta|medic|dentista|exame|plano de saude|hospital/,/saude/],[/netflix|spotify|prime|disney|hbo|youtube|assinatura|icloud|academia|gympass/,/assinatura/],[/cinema|show|ingresso|balada|viagem|jogo|parque|teatro/,/lazer/],[/curso|escola|faculdade|livro|mensalidade|udemy/,/educa/],[/aluguel|condominio|energia|conta de luz|agua|internet|\bgas\b|iptu|\bluz\b/,/moradia/],[/roupa|loja|shopee|amazon|mercado livre|magalu|shein|americanas|presente|sapato|tenis/,/compras/]];
const CAT_RULES_IN = [[/salario|holerite|pagamento mensal/,/salario/],[/freela|projeto|servico|cliente|venda/,/freelance/],[/rendimento|dividendo|cdb|juros|lucro/,/rendimento/]];
function guessCat(desc,type,raw){
  const list=S.main.cats[type], nd=norm(desc), toks=nd.split(' ').filter(w=>w.length>=4), votes={};
  for(const k in S.months) S.months[k].tx.forEach(t=>{
    if(t.t!==type) return; const td=norm(t.desc);
    if(td===nd) votes[t.cat]=(votes[t.cat]||0)+5;
    else if(toks.length && td.split(' ').some(w=>toks.indexOf(w)>=0)) votes[t.cat]=(votes[t.cat]||0)+1;
  });
  let best=null,bv=0; for(const id in votes) if(votes[id]>bv && list.some(c=>c.id===id)){ best=id; bv=votes[id]; }
  if(best) return best;
  const text=norm(desc+' '+(raw||''));
  const rules = type==='in'?CAT_RULES_IN:CAT_RULES_OUT;
  for(const r of rules){ if(r[0].test(text)){ const c=list.find(x=>r[1].test(norm(x.name))); if(c) return c.id; } }
  const other=list.find(x=>/outro/.test(norm(x.name)));
  return (other||(type==='out'?list[list.length-1]:list[0])).id;
}
function splitMessages(text){
  const lines=String(text).replace(/\r/g,'').split('\n');
  const hdr=/^‎?\[?(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:\s?[AaPp]\.?[Mm]\.?)?\]?\s*(?:[-–]\s*)?([^:]{1,60}?):\s(.*)$/;
  const tsOnly=/^‎?\[?\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}:\d{2}/;
  const isExport=lines.some(l=>hdr.test(l));
  const out=[];
  for(const ln of lines){
    const m=ln.match(hdr);
    if(m){ let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2000; if(mo>12){ const t=d; d=mo; mo=t; } out.push({ts:true,date:y+'-'+pad(mo)+'-'+pad(d),text:m[7]}); }
    else if(isExport){ if(tsOnly.test(ln)) continue; if(out.length && ln.trim()) out[out.length-1].text+=' '+ln.trim(); }
    else if(ln.trim()) out.push({ts:false,date:null,text:ln.trim()});
  }
  return out;
}
function parseMsg(msg){
  const raw=String(msg.text||'').trim(); if(!raw) return null;
  const base=msg.date||TODAY; let date=base, t=raw;
  if(/\banteontem\b/i.test(t)) date=addDays(base,-2); else if(/\bontem\b/i.test(t)) date=addDays(base,-1);
  t=t.replace(/\b(anteontem|ontem|hoje)\b/gi,' ');
  const dm=t.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);
  if(dm){
    let d=+dm[1], mo=+dm[2], y=dm[3]?+dm[3]:+base.slice(0,4); if(y<100) y+=2000;
    if(mo>=1&&mo<=12&&d>=1&&d<=31){ let ds=y+'-'+pad(mo)+'-'+pad(d); if(!dm[3]&&ds>TODAY) ds=(y-1)+'-'+pad(mo)+'-'+pad(d); date=ds; }
    t=t.replace(dm[0],' ');
  }
  t=t.replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g,' ').replace(/(?:final|cart[aã]o)\s*:?\s*\d{4}\b/gi,' ').replace(/\*+\s?\d{4}/g,' ').replace(/\b\d{1,2}\s?x\b/gi,' ');
  const re=/(R\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/g; let m; const c=[];
  while((m=re.exec(t))) c.push({raw:m[0],val:parseMoney(m[2]),cur:!!m[1],dec:/[.,]\d{1,2}$/.test(m[2])});
  const cand=c.filter(x=>x.val>0&&x.val<100000000); if(!cand.length) return null;
  const pick=cand.find(x=>x.cur)||cand.find(x=>x.dec)||cand[0];
  const isIn=/\b(recebi|recebido|recebimento|sal[aá]rio|entrada|dep[oó]sito|te enviou|reembolso|estorno|rendimento|freelance|freela|venda)\b/i.test(raw) && !/\b(enviado|enviei|paguei|pagamento)\b/i.test(raw);
  const type=isIn?'in':'out';
  let pay=''; const pl=ST().pays;
  const want = /pix/i.test(raw)?'pix':/cr[eé]dito/i.test(raw)?'credito':/d[eé]bito/i.test(raw)?'debito':/dinheiro/i.test(raw)?'dinheiro':/boleto/i.test(raw)?'boleto':'';
  if(want) pay = pl.find(x=>norm(x).replace(/\s/g,'').indexOf(want)>=0) || '';
  let d=t.replace(pick.raw,' ').replace(/R\$/g,' ')
    .replace(/compra\s+(aprovada|realizada|no d[eé]bito|no cr[eé]dito|no cart[aã]o)/gi,' ').replace(/\bno cart[aã]o( de (cr[eé]dito|d[eé]bito))?\b/gi,' ')
    .replace(/\b(pix (recebido|enviado|realizado)|transfer[eê]ncia (recebida|enviada))\b/gi,' ')
    .replace(/\b(recebi|paguei|gastei|comprei|valor|no valor de|aprovada|aprovado)\b/gi,' ').replace(/\b(pix|dinheiro|boleto|(no )?cart[aã]o( de)?( cr[eé]dito| d[eé]bito)?|(no )?(cr[eé]dito|d[eé]bito))\b/gi,' ')
    .replace(/[|•*]+/g,' ').replace(/\s+/g,' ').trim();
  d=d.replace(/^(em|no|na|de|do|da|para|pra|com|por|a|o)\s+/i,'').replace(/\s+(em|no|na|de|do|da|para|pra|com|por)$/i,'').replace(/^[\s\-–:,.]+|[\s\-–:,.]+$/g,'').trim();
  if(!d) d = isIn?'Entrada':'Compra';
  d=d.charAt(0).toUpperCase()+d.slice(1); if(d.length>80) d=d.slice(0,80);
  const cat=guessCat(d,type,raw);
  const dup = txs(mk(date)).some(x=>x.date===date&&x.amt===pick.val&&x.t===type);
  return {on:!dup,t:type,amt:pick.val,desc:d,cat:cat,date:date,pay:pay,raw:raw,dup:dup};
}

  for(const k in S.months){

function payBill(id,key){
  const b=S.main.bills.find(x=>x.id===id); if(!b) return;
  const tx={id:uid(),t:'out',amt:b.amt,desc:b.name,cat:b.cat,date:TODAY,pay:'Boleto',bill:b.id+'@'+key}, k=mk(TODAY);
  (S.months[k]=S.months[k]||{tx:[]}).tx.push(tx); touch(k);

function unpayBill(id,key){
  const b=S.main.bills.find(x=>x.id===id); if(!b||!b.paid||!b.paid[key]) return;
  const txId=b.paid[key].txId; delete b.paid[key]; touch('main');

const csvEscape = v => { v=String(v==null?'':v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
async function download(name,data){
  let d=null; try{ d = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(!d){ toast('Download indisponível nesta visualização'); return; }
  try{ await d.save({filename:name,data:data}); toast('Arquivo pronto'); }catch(e){ if(!e||e.code!=='declined') toast('Não foi possível salvar o arquivo'); }
}
function doExportCsv(){
  const rows=[['Data','Tipo','Descrição','Categoria','Forma de pagamento','Valor']], all=[];
  for(const k in S.months) S.months[k].tx.forEach(t=>all.push(t));
  all.sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.t==='in'?'Entrada':'Saída',t.desc,catById(t.cat).name,t.pay||'',((t.t==='in'?1:-1)*t.amt/100).toFixed(2).replace('.',',')]));
  download('lancamentos.csv','﻿'+rows.map(r=>r.map(csvEscape).join(';')).join('\r\n'));
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result); if(!o||!o.main||!o.months) throw 0;
      confirmBox('Restaurar este backup substitui tudo que existe agora.','Restaurar',()=>{
        Object.keys(S.months).forEach(k=>{ S.months[k]={tx:[]}; touch(k); });
        S.main=normalize(o.main); Object.keys(o.months).forEach(k=>{ S.months[k]={tx:o.months[k].tx||[]}; touch(k); }); touch('main');
        applyAppearance(); closeModal(); toast('Backup restaurado'); render();
      });
    }catch(e){ toast('Arquivo de backup inválido'); }
  };
  fr.readAsText(file);
}
function wipe(){

  if(kind==='tx'){
    const amt=parseMoney(f.amt.value), desc=f.desc.value.trim(), date=f.date.value, type=f.t.value;
    if(!(amt>0)) return err('Informe um valor maior que zero.');
    if(!desc) return err('Diga com o quê foi (ex.: Mercado).');
    if(!date) return err('Escolha a data.');
    const payRaw = f.pay ? (f.pay.value||'') : '';
    const wp = type==='out' ? walletPayInfo(payRaw) : null;
    const payTxt = wp ? wp.label : (payRaw.indexOf('w:')===0 ? '' : payRaw);
    const unexp = type==='out' && f.unexp && f.unexp.checked;
    const id=form.dataset.id;
    if(id){
      const prevT=findTx(id);
      removeTxKeep(id);
      refundWallet(id);
      const t={id:id,t:type,amt:amt,desc:desc,cat:f.cat.value,date:date,pay:payTxt};
      if(prevT && prevT.adj) t.adj=true;
      if(unexp) t.unexpected=true;
      if(wp){ t.walletId=wp.id; chargeWallet(S.main.wallets.find(x=>x.id===wp.id),amt,desc,date,id); }
      if(oldBill) t.bill=oldBill; addTx(t); touch('main');
    } else {
      const newId=uid();
      const base={t:type,amt:amt,desc:desc,cat:f.cat.value,pay:payTxt}, rep=Math.max(0,Math.min(24,parseInt(f.rep.value,10)||0));
      if(wp) base.walletId=wp.id;
      S.main.last[type+'Cat']=f.cat.value; if(payTxt && !wp) S.main.last.pay=payTxt; touch('main');
      addTx(Object.assign({id:newId,date:date},base,unexp?{unexpected:true}:{}));
      if(wp) chargeWallet(S.main.wallets.find(x=>x.id===wp.id),amt,desc,date,newId);
      const day=dateOf(date).getDate();
      for(let i=1;i<=rep;i++){ const k=addM(mk(date),i); addTx(Object.assign({id:uid(),date:k+'-'+pad(Math.min(day,dim(k)))},base)); }
      if(rep) toast('Repetido em mais '+rep+(rep===1?' mês':' meses')+(wp?' (o cartão é debitado só neste primeiro)':''));
      if(unexp){
        closeModal(); render();
        const F=fluxoCtx(mk(date)), D=fatiaCtx();
        openModal('<h3>Registrado. Vamos se ajustar?</h3><p class="sub" style="margin:-8px 0 14px;color:var(--muted);font-size:13.5px">'+money(amt)+' em “'+esc(desc)+'”. Agora dá pra gastar <b style="color:var(--ink)">'+money(D.tomorrowAllowance==null?D.todayLeft:D.tomorrowAllowance)+'</b> por dia até '+shortDate(D.range.end)+'.</p>'+fluxoTips(F).join('')+'<div class="actions"><button type="button" class="btn primary" data-act="closeModal">Entendi</button></div>','wide');
        return true;
      }
      if(again){ closeModal(); render(); toast('Lançado. Pode lançar o próximo.'); openTx(null,type); return true; }
      closeModal(); render(); toast((type==='out'?'Gasto':'Entrada')+' de '+money(amt)+' lançado'); return true;
    }
  } else if(kind==='bill'){
    const amt=parseMoney(f.amt.value), name=f.name.value.trim();
    if(!name) return err('Informe o nome da conta.');
    if(!(amt>0)) return err('Informe um valor maior que zero.');
    const rec=f.freq.value==='m', id=form.dataset.id, day=parseInt(f.day.value,10), from=f.from.value, date=f.date.value;
    if(rec&&(!(day>=1&&day<=31)||!from)) return err('Informe o dia (1 a 31) e o mês inicial.');
    if(!rec&&!date) return err('Escolha a data de vencimento.');
    const rem=Math.max(0,Math.min(30,parseInt(f.remind.value,10)||0));
    let b=id?S.main.bills.find(x=>x.id===id):null;
    if(!b){ b={id:uid(),paid:{}}; S.main.bills.push(b); }
    Object.assign(b,{name:name,amt:amt,cat:f.cat.value,rec:rec,remind:rem});
    if(rec){ b.day=day; b.from=from; delete b.date; } else { b.date=date; delete b.day; delete b.from; }
    touch('main');
  } else if(kind==='goal'){
    const target=parseMoney(f.target.value), saved=f.saved.value.trim()?parseMoney(f.saved.value):0, name=f.name.value.trim();
    const monthly=f.monthly.value.trim()?parseMoney(f.monthly.value):0, debt=f.gtype.value==='debt';
    const rate=debt?(parseFloat(String(f.rate.value).replace(',','.'))||0):0;
    if(!name) return err('Informe o nome.');
    if(!(target>0)) return err('Informe o valor total.');
    if(isNaN(saved)||saved<0) return err('O valor já guardado ou pago deve ser zero ou maior.');
    if(isNaN(monthly)||monthly<0) return err('O valor mensal deve ser zero ou maior.');
    if(rate<0||rate>30) return err('Informe juros entre 0 e 30% ao mês.');
    const id=form.dataset.id; let g=id?S.main.goals.find(x=>x.id===id):null;
    if(!g){ g={id:uid()}; S.main.goals.push(g); S.plan.goal=g.id; }
    Object.assign(g,{type:debt?'debt':'goal',name:name,target:target,saved:saved,rate:rate,monthly:monthly,date:f.date.value||''}); touch('main');
  } else if(kind==='dep'){
    const amt=parseMoney(f.amt.value); if(isNaN(amt)||amt===0) return err('Informe um valor.');
    const g=S.main.goals.find(x=>x.id===form.dataset.id); g.saved=Math.max(0,g.saved+amt); touch('main');
    toast(g.type==='debt'?(amt>0?'Pagamento registrado':'Pagamento corrigido'):(amt>0?'Depósito registrado':'Retirada registrada'));
  } else if(kind==='cat'){
    const name=f.name.value.trim(), k=f.kind.value; if(!name) return false;

    if(all.some(c=>c.name.toLowerCase()===name.toLowerCase())){ toast('Já existe uma categoria com esse nome'); return false; }
    S.main.cats[k].push({id:'c-'+uid(),name:name,kind:k==='out'?'want':undefined,color:PALETTE[all.length%PALETTE.length]});
    touch('main'); render(); return true;
  } else if(kind==='pay'){
    const name=f.name.value.trim(); if(!name) return false;
    if(ST().pays.some(p=>p.toLowerCase()===name.toLowerCase())){ toast('Essa forma de pagamento já existe'); return false; }
    ST().pays.push(name); touch('main'); render(); return true;
  } else if(kind==='wallet'){
    const brand=f.brand.value, name=f.name.value.trim(), balance=f.balance.value.trim()?parseMoney(f.balance.value):0;
    const limit=f.limit&&f.limit.value.trim()?parseMoney(f.limit.value):0;
    const log=[]; if(balance>0) log.push({id:uid(), date:TODAY, desc:'Saldo inicial', amt:balance});

    touch('main'); toast(w.limit>0?'Limite mensal definido: '+money(w.limit):'Limite removido');
    closeModal(); render(); return true;
  } else if(kind==='walletmove'){
    const amt=parseMoney(f.amt.value); if(!(amt>0)) return err('Informe um valor maior que zero.');
    const sign=parseInt(form.dataset.sign,10)||1, w=S.main.wallets.find(x=>x.id===form.dataset.id);
    if(!w) return false;
    const date=f.date&&f.date.value?f.date.value:TODAY, desc=f.desc?f.desc.value.trim():'';

  } else if(kind==='invest'){
    const type=f.type.value, name=f.name.value.trim(), amount=f.amount.value.trim()?parseMoney(f.amount.value):0;
    const log=[]; if(amount>0) log.push({id:uid(), date:TODAY, desc:'Valor inicial', amt:amount});
    S.main.investments.push({id:uid(), type:type, name:name, amount:Math.max(0,amount), log:log});
    touch('main'); closeModal(); render(); return true;
  } else if(kind==='investmove'){
    const amt=parseMoney(f.amt.value); if(!(amt>0)) return err('Informe um valor maior que zero.');
    const sign=parseInt(form.dataset.sign,10)||1, inv=S.main.investments.find(x=>x.id===form.dataset.id);
    if(!inv) return false;
    const date=f.date&&f.date.value?f.date.value:TODAY, desc=f.desc?f.desc.value.trim():'';

    (inv.log=inv.log||[]).push({id:uid(), date:date, desc:desc, amt:sign*amt});

    toast(sign>0?'Aporte registrado':'Resgate registrado');
  } else if(kind==='drvCfg'){
    const kml=parseNum(f.kml.value), fuel=parseMoney(f.fuel.value), costKm=f.costKm.value.trim()?parseMoney(f.costKm.value):0;
    const rentWeek=f.rentWeek.value.trim()?parseMoney(f.rentWeek.value):0, goalMonth=f.goalMonth.value.trim()?parseMoney(f.goalMonth.value):0;
    const workDays=Math.min(7,Math.max(1,parseInt(f.workDays.value,10)||6));
    if(!(kml>0)) return err('Informe o consumo do carro (km por litro).');
    if(!(fuel>0)) return err('Informe o preço do litro.');
    if([costKm,rentWeek,goalMonth].some(v=>isNaN(v)||v<0)) return err('Confira os valores.');
    const D=DRV(); D.cfg={kml:kml,fuel:fuel,costKm:costKm,rentWeek:rentWeek,goalMonth:goalMonth,workDays:workDays,post:!!f.post.checked,setup:true};

  } else if(kind==='drvStart'){
    const odo=parseKm(f.odo.value);
    if(isNaN(odo)) return err('Digite o odômetro (km que aparece no painel).');
    const D=DRV(); D.open={date:TODAY,odoStart:odo,start:nowHM()}; touch('main'); toast('Bom trabalho! Encerre o dia quando parar.');
  } else if(kind==='drvDay'){
    const D=DRV(), id=form.dataset.id, closing=form.dataset.closing==='1';
    const odoStart=parseKm(f.odoStart.value), odoEnd=parseKm(f.odoEnd.value), gross=f.gross.value.trim()?parseMoney(f.gross.value):NaN;
    const trips=parseInt(f.trips.value,10)||0, hours=f.hours.value.trim()?parseNum(f.hours.value):0;
    const fuelReal=f.fuelReal.value.trim()?parseMoney(f.fuelReal.value):0, other=f.other.value.trim()?parseMoney(f.other.value):0;
    const date = closing ? (D.open?D.open.date:TODAY) : (f.date.value||TODAY);
    if(isNaN(odoStart)) return err('Digite o odômetro inicial.');
    if(isNaN(odoEnd)) return err('Digite o odômetro final (km no painel agora).');
    if(odoEnd<odoStart) return err('O odômetro final precisa ser maior que o inicial.');
    if(odoEnd-odoStart>2000) return err('Mais de 2.000 km num dia? Confira os números do odômetro.');
    if(isNaN(gross)||gross<0) return err('Informe quanto você ganhou no dia (pode ser 0).');
    if(isNaN(hours)||hours<0||hours>24) return err('Horas entre 0 e 24.');
    if(isNaN(fuelReal)||isNaN(other)||fuelReal<0||other<0) return err('Confira os gastos.');
    let day = id ? D.days.find(x=>x.id===id) : null;
    if(day) drvUnpost(day); else { day={id:uid(),txIds:[]}; D.days.push(day); }
    Object.assign(day,{date:date,odoStart:odoStart,odoEnd:odoEnd,gross:gross,trips:trips,hours:hours,fuelReal:fuelReal,other:other});
    if(f.post.checked) drvPost(day);
    if(closing) D.open=null;
    touch('main'); closeModal(); render();
    if(!id) drvResult(day); else toast('Dia atualizado');
    return true;
  } else if(kind==='card'){
    return submitCard(form,err);
  } else if(kind==='subscribe'){
    const email=f.payerEmail.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('Digite um e-mail válido.');
    const btn=form.querySelector('.btn.primary'); btn.disabled=true; btn.textContent='Abrindo o Mercado Pago…';
    billCall('subscribe',{payerEmail:email}).then(r=>{
      if(r.initPoint){ location.href=r.initPoint; return; }
      if(r.already){ S.bill=r; closeModal(); render(); toast('Sua assinatura já está ativa.'); }
    }).catch(e=>{ btn.disabled=false; btn.textContent='Ir para o pagamento'; err(e.message||'Não deu certo. Tente de novo.'); });
    return true;
  } else if(kind==='cycle'){
    const cycleDay=Math.min(28,Math.max(1,parseInt(f.cycleDay.value,10)||1));
    S.main.daily = Object.assign({amount:0}, S.main.daily||{}, {cycleDay:cycleDay, cycle:cycleStart(cycleDay,TODAY)});
    touch('main');
    toast('Pronto: o saldo é dividido até o dia '+cycleDay+'.');
  } else if(kind==='adjbal'){
    const target=parseMoney(f.amt.value);
    if(isNaN(target)) return err('Informe o valor.');
    const diff=target-balanceUntil(TODAY,true);
    if(diff!==0){
      addTx({id:uid(),t:diff>0?'in':'out',amt:Math.abs(diff),desc:'Ajuste de saldo',cat:(diff>0?S.main.cats.in[0].id:S.main.cats.out[0].id),date:TODAY,pay:'',adj:true});
      toast('Saldo ajustado para '+money(target));
    } else toast('O saldo já estava certo.');
  } else if(kind==='unexpected'){
    const amt=parseMoney(f.amt.value), desc=f.desc.value.trim(), date=f.date.value||TODAY;
    if(!(amt>0)) return err('Informe um valor maior que zero.');
    if(!desc) return err('Descreva o que aconteceu.');
    const wp=walletPayInfo(f.pay.value), newId=uid();
    const nt={id:newId,t:'out',amt:amt,desc:desc,cat:f.cat.value,date:date,pay:wp?wp.label:(f.pay.value||''),unexpected:true};
    if(wp) nt.walletId=wp.id;
    addTx(nt);
    if(wp) chargeWallet(S.main.wallets.find(x=>x.id===wp.id),amt,desc,date,newId);
    closeModal(); render();
    const wasMonth=S.month; const F=fluxoCtx(mk(date)); S.month=wasMonth;
    openModal('<h3>Registrado</h3><p class="sub" style="margin:-8px 0 14px;color:var(--muted);font-size:13.5px">'+money(amt)+' em "'+esc(desc)+'" foi somado às saídas de '+esc(monthName(mk(date)))+'.</p>'+fluxoTips(F).join('')+'<div class="actions"><button type="button" class="btn primary" data-act="closeModal">Entendi</button></div>','wide');
    return true;
  } else if(kind==='catmove'){
    const id=form.dataset.id, ck=form.dataset.kind, to=f.to.value;
    for(const k in S.months){ let ch=false; S.months[k].tx.forEach(t=>{ if(t.cat===id){ t.cat=to; ch=true; } }); if(ch) touch(k); }
    S.main.bills.forEach(b=>{ if(b.cat===id) b.cat=to; });
    S.main.cats[ck]=S.main.cats[ck].filter(c=>c.id!==id); delete S.main.budgets[id]; touch('main');
    toast('Categoria removida');
  }
  closeModal(); render(); return true;
}

/* ---------- início ---------- */
async function boot(){
  let found=false, failed=false, lastErr=null;
  try{ found = await loadAll(); }
  catch(e){
    lastErr=e;
    if(!(e && e.code==='permission-denied')){
      try{ await new Promise(r=>setTimeout(r,1200)); found = await loadAll(); lastErr=null; }
      catch(e2){ lastErr=e2; failed=true; }
    } else failed=true;
  }
  if(failed && lastErr && lastErr.code==='permission-denied'){
    // As regras do banco bloquearam: teste acabou ou assinatura venceu. Mostra a tela de assinatura.
    try{ S.bill = await billingCall('status'); }catch(e){}
    if(!S.bill || !S.bill.access){ S.locked=true; applyAppearance(); S.ready=true; render(); return; }
    try{ found = await loadAll(); failed=false; }catch(e){}
  }
  if(failed){
    // Não zera os dados por causa de uma falha de conexão — só avisa e deixa tentar de novo.
    setSave('error');
    toast('Não foi possível carregar seus dados agora. Verifique sua internet e recarregue a página.');
  } else if(!found){
    // Só chega aqui quando a leitura funcionou e realmente não havia nada salvo (conta nova).
    S.main=defaultMain(); S.months={}; touchAll();
  } else {
    setSave('saved');
  }
  applyAppearance(); S.ready=true; render();
}
chrome();

// ---------- assinatura (servidor) ----------
async function billingCall(action, extra){
  const u=fbAuth.currentUser; if(!u) throw new Error('Faça login de novo.');
  const tok=await u.getIdToken();
  let r;
  try{
    r=await fetch('/.netlify/functions/billing',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(Object.assign({action:action},extra||{}))});
  }catch(e){ throw new Error('Sem conexão com o servidor. Tente de novo.'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Não foi possível falar com o servidor.');
  return d;
}
window.__billing={call:billingCall};
window.__unlock=()=>{ S.locked=false; boot(); };
let deniedAt=0;
window.__onDenied=async()=>{
  if(Date.now()-deniedAt<60000) return; deniedAt=Date.now();
  try{ const b=await billingCall('status'); S.bill=b; if(!b.access){ S.locked=true; closeModal(); render(); } }catch(e){}
};

    }catch(e){}
  }
  toast('Ainda estamos aguardando a confirmação do Mercado Pago. Você pode tocar em “Já paguei” daqui a pouco.');
  render();
}

// ---------- "online agora" para o painel do dono ----------
function startPresence(user){
  const ref=doc(fsDb,'presence/'+user.uid);
  const dev=((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'app instalado':'navegador')+' · '+(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'celular':'computador');
  const beat=()=>{
    if(document.visibilityState!=='visible') return;
    const data={name:store.name||'',lastSeen:serverTimestamp(),device:dev,tab:S.locked?'assinatura':(S.tab||'home')};
    if(user.email) data.email=user.email;
    setDoc(ref,data,{merge:true}).catch(()=>{});
  };
  beat(); setInterval(beat,60000);
  document.addEventListener('visibilitychange',beat);
}

onAuthStateChanged(fbAuth, async user => {
  if(!user){ try{ localStorage.removeItem('ag_conta'); }catch(e){} location.replace('/entrar'); return; }
  try{ localStorage.setItem('ag_conta','1'); }catch(e){}
  // No app instalado, pede ao navegador para guardar os dados de forma permanente (o login não some).
  try{ if((matchMedia('(display-mode: standalone)').matches||navigator.standalone) && navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(ok=>{ if(!ok) navigator.storage.persist(); }); }catch(e){}
  store.db = fsApi;
  store.uid = user.uid;
  store.base = fsApi.doc('data/users/'+user.uid+'/app');
  store.email = user.email || '';
  store.name = user.displayName || (user.email ? user.email.split('@')[0] : '');
  startPresence(user);
  const qs = new URLSearchParams(location.search);
  const back = qs.get('assinatura'), wantSub = qs.get('assinar');   // ?assinar=1 vem do botão dos e-mails
  if(back || wantSub) history.replaceState(null,'',location.pathname);
  try{ S.bill = await billingCall('status'); }catch(e){ S.bill = null; console.warn('[assinatura]', e.message); }
  if(S.bill && !S.bill.access){
    S.locked=true; applyAppearance(); S.ready=true; render();
  } else {
    await boot();
    // Logo no começo do teste: convida a deixar o cartão cadastrado (uma vez). Pelo e-mail: abre direto a assinatura.
    try{ if(wantSub && S.bill && !S.bill.isAdmin && S.bill.mpStatus!=='authorized') openSubscribe(); else maybeAskCard(); }catch(e){}
  }
  if(back) waitForPayment();
});
window.__signOut = () => signOut(fbAuth).then(()=>{ try{ localStorage.removeItem('ag_conta'); }catch(e){} location.href='/entrar'; });
})();
</script>
